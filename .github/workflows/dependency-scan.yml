name: OWASP Dependency-Track Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      - name: Generer le SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file bom.json --output-format JSON

      - name: Upload SBOM vers Dependency-Track
        run: |
          jq -n --arg bom "$(base64 -w 0 bom.json)" \
            '{"projectName":"demo-dep-track","projectVersion":"1.0.0","autoCreate":true,"bom":$bom}' \
            > payload.json
          curl -sf -X PUT \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}" \
            -H "ngrok-skip-browser-warning: true" \
            -d @payload.json \
            "${{ secrets.DEPENDENCY_TRACK_URL }}/api/v1/bom"

      - name: Attendre l'analyse Dependency-Track
        run: sleep 15

      - name: Verifier le score de risque
        run: |
          RISK_SCORE=$(curl -s -H "X-Api-Key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}" \
            -H "ngrok-skip-browser-warning: true" \
            "${{ secrets.DEPENDENCY_TRACK_URL }}/api/v1/project/lookup?name=demo-dep-track&version=1.0.0" \
            | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              console.log(data.lastInheritedRiskScore || 0);
            ")
          echo "RISK_SCORE=$RISK_SCORE" >> $GITHUB_ENV
          echo "Score de risque: $RISK_SCORE"
          if [ "$RISK_SCORE" -gt 70 ]; then
            echo "!! Score de risque trop eleve ($RISK_SCORE > 70)"
            exit 1
          else
            echo "Score de risque acceptable ($RISK_SCORE <= 70)"
          fi

      - name: Upload du SBOM en artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: bom.json
